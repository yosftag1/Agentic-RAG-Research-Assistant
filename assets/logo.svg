<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b483a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d6c95;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .icon-text { font-family: 'Manrope', -apple-system, sans-serif; font-size: 34px; font-weight: 700; fill: #b483a7; }
      .title-text { font-family: 'Fraunces', Georgia, serif; font-size: 38px; font-weight: 600; fill: url('#textGrad'); }
      .bg-rect { fill: #f0e3d8; stroke: #b483a7; stroke-width: 2; stroke-opacity: 0.3; }
    </style>
  </defs>
  
  <g transform="translate(10, 30)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="64" height="64" rx="16" class="bg-rect" filter="url(#glow)"/>
    <text x="32" y="44" text-anchor="middle" class="icon-text">RA</text>
    
    <!-- App Title -->
    <text x="88" y="44" class="title-text">Research Assistant</text>
  </g>
</svg>
